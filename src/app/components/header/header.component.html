<header>
  <!-- Botón de accesibilidad -->
<div class="accessibility-settings" aria-label="Configuración de accesibilidad">
  <button (click)="toggleMenu()" attr.aria-expanded="{{menuVisible}}" aria-controls="accessibility-menu">
    <svg  xmlns="http://www.w3.org/2000/svg"  width="24"  height="24"  viewBox="0 0 24 24"  fill="none"  stroke="currentColor"  stroke-width="2"  stroke-linecap="round"  stroke-linejoin="round"  class="icon icon-tabler icons-tabler-outline icon-tabler-settings"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M10.325 4.317c.426 -1.756 2.924 -1.756 3.35 0a1.724 1.724 0 0 0 2.573 1.066c1.543 -.94 3.31 .826 2.37 2.37a1.724 1.724 0 0 0 1.065 2.572c1.756 .426 1.756 2.924 0 3.35a1.724 1.724 0 0 0 -1.066 2.573c.94 1.543 -.826 3.31 -2.37 2.37a1.724 1.724 0 0 0 -2.572 1.065c-.426 1.756 -2.924 1.756 -3.35 0a1.724 1.724 0 0 0 -2.573 -1.066c-1.543 .94 -3.31 -.826 -2.37 -2.37a1.724 1.724 0 0 0 -1.065 -2.572c-1.756 -.426 -1.756 -2.924 0 -3.35a1.724 1.724 0 0 0 1.066 -2.573c-.94 -1.543 .826 -3.31 2.37 -2.37c1 .608 2.296 .07 2.572 -1.065z" /><path d="M9 12a3 3 0 1 0 6 0a3 3 0 0 0 -6 0" /></svg>
  </button>

  <div *ngIf="menuVisible" id="accessibility-menu" role="menu">
    <section>
      <label>Lector de pantalla:</label>
      <button (click)="startSpeech()">Iniciar</button>
      <button (click)="pauseSpeech()">Pausar</button>
      <button (click)="stopSpeech()">Detener</button>
    </section>

    <section>
      <label>Contraste:</label>
      <button (click)="toggleContrast()">Cambiar contraste</button>
    </section>

    <section>
      <label>Tamaño de texto:</label>
      <button (click)="adjustFontSize(1)">Aumentar</button>
      <button (click)="adjustFontSize(-1)">Disminuir</button>
    </section>

    <section>
      <label for="fontSelector">Tipo de letra:</label>
      <select id="fontSelector" (change)="changeFont($event)">
        <option value="Arial">Arial</option>
        <option value="Verdana">Verdana</option>
        <option value="Roboto">Roboto</option>
      </select>
    </section>
  </div>
</div>

  <div class="logo">
    <a href="index.html">
      <img src="assets/imagenes/Logotipo.png" alt="Logo del gimnasio">
    </a>
    <p class="lema">Unidos por la fuerza, imparables en el proceso</p>
  </div>

  <app-navbar 
    [user]="user"
    (menuItemClicked)="handleNavbarEvent({type: 'menuItemClicked', data: $event})"
    (loginRequested)="handleNavbarEvent({type: 'loginRequested'})"
    (logoutRequested)="handleNavbarEvent({type: 'logoutRequested'})">
  </app-navbar>
</header>
