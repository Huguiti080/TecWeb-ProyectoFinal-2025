<div class="container">
  <h2 class="title">QR Dinámico de Red Social</h2>
  <div class="qr-grid">
    <div class="qr-card">
      <div class="qr-placeholder">
        <qrcode [qrdata]="qrRedSocialURL" [width]="150" [errorCorrectionLevel]="'M'"></qrcode>
      </div>
      <p class="qr-label">{{ redSocialActiva }}</p>
      <p class="qr-label">Enlace: {{ qrRedSocialURL }}</p>
    </div>
  </div>
</div>
